name: CI
on: [push, pull_request]
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build
    if: ${{ false }} # Temporarily disabled while stabilizing the ESP32 QEMU lane.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        lua: [lua54, lua53, lua52, lua51]
        target:
        - x86_64-unknown-linux-gnu
        - i686-unknown-linux-gnu
        - aarch64-unknown-linux-gnu
        - arm-unknown-linux-gnueabi
        - x86_64-apple-darwin
        - aarch64-apple-darwin
        - x86_64-pc-windows-gnu
        - x86_64-pc-windows-msvc
        - wasm32-unknown-emscripten
        - wasm32-wasip2
        - xtensa-esp32-none-elf
        - xtensa-esp32s2-none-elf
        - xtensa-esp32s3-none-elf
        include:
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-latest
        - target: i686-unknown-linux-gnu
          os: ubuntu-latest
        - target: aarch64-unknown-linux-gnu
          os: ubuntu-latest
        - target: arm-unknown-linux-gnueabi
          os: ubuntu-latest
        - target: x86_64-apple-darwin
          os: macos-latest
        - target: aarch64-apple-darwin
          os: macos-latest
        - target: x86_64-pc-windows-gnu
          os: ubuntu-latest
        - target: x86_64-pc-windows-msvc
          os: windows-latest
        - target: wasm32-unknown-emscripten
          os: ubuntu-latest
        - target: wasm32-wasip2
          os: ubuntu-latest
        - target: xtensa-esp32-none-elf
          os: ubuntu-latest
        - target: xtensa-esp32s2-none-elf
          os: ubuntu-latest
        - target: xtensa-esp32s3-none-elf
          os: ubuntu-latest
    steps:
    - uses: actions/checkout@main
    - uses: ./.github/actions/setup-deps
      with:
        target: ${{ matrix.target }}
    - name: Build ${{ matrix.lua }}
      run: |
        case "${{ matrix.target }}" in
          xtensa-esp32*-none-elf)
            cargo +esp build -Zbuild-std=core,alloc --manifest-path testcrate/Cargo.toml --release --lib --features ${{ matrix.lua }} --target ${{ matrix.target }}
            ;;
          *)
            cargo build --manifest-path testcrate/Cargo.toml --release --lib --features ${{ matrix.lua }} --target ${{ matrix.target }}
            ;;
        esac
      shell: bash

  test:
    name: Test
    if: ${{ false }} # Temporarily disabled while stabilizing the ESP32 QEMU lane.
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        lua: [lua54, lua53, lua52, lua51]
        target:
        - x86_64-unknown-linux-gnu
        - x86_64-apple-darwin
        - aarch64-apple-darwin
        - x86_64-pc-windows-msvc
        - wasm32-wasip2
        include:
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-latest
        - target: x86_64-apple-darwin
          os: macos-latest
        - target: aarch64-apple-darwin
          os: macos-latest
        - target: x86_64-pc-windows-msvc
          os: windows-latest
        - target: wasm32-wasip2
          os: ubuntu-latest
    steps:
    - uses: actions/checkout@main
    - uses: ./.github/actions/setup-deps
      with:
        target: ${{ matrix.target }}
    - name: Run ${{ matrix.lua }} tests
      run: |
        cargo test --manifest-path testcrate/Cargo.toml --release --lib --features ${{ matrix.lua }} --target ${{ matrix.target }}
      shell: bash

  test_standalone:
    name: Test Standalone
    if: ${{ false }} # Temporarily disabled while stabilizing the ESP32 QEMU lane.
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
        - os: macos-latest
          target: x86_64-apple-darwin
        - os: windows-latest
          target: x86_64-pc-windows-msvc
    steps:
    - uses: actions/checkout@main
    - uses: ./.github/actions/setup-deps
      with:
        target: ${{ matrix.target }}
    - name: Run standalone tests
      run: |
        cargo test --target ${{ matrix.target }}

  test_xtensa_esp32_qemu:
    name: Test xtensa-esp32-espidf (QEMU)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
    - uses: ./.github/actions/setup-deps
      with:
        target: xtensa-esp32-espidf
    - name: Install espflash
      run: |
        cargo install espflash --locked
      shell: bash
    - name: Run Lua tests under ESP32 QEMU
      env:
        ESP_IDF_TOOLS_INSTALL_DIR: workspace
        IDF_TOOLS_PATH: ${{ github.workspace }}/.embuild/espressif
        MCU: esp32
      run: |
        set -euo pipefail
        cargo +esp build -Zbuild-std=std,panic_abort --manifest-path testcrate/Cargo.toml --release --bin qemu-testcrate --features lua54,qemu --target xtensa-esp32-espidf
        IDF_TOOLS_PY="$(find .embuild/espressif/esp-idf -path '*/tools/idf_tools.py' -print -quit)"
        if [ -z "$IDF_TOOLS_PY" ]; then
          echo "Failed to locate idf_tools.py"
          exit 1
        fi
        python3 "$IDF_TOOLS_PY" --non-interactive install qemu-xtensa
        QEMU_BIN="$(find "$IDF_TOOLS_PATH/tools/qemu-xtensa" -path '*/qemu/bin/qemu-system-xtensa' -print -quit)"
        if [ -z "$QEMU_BIN" ]; then
          echo "Failed to locate qemu-system-xtensa"
          exit 1
        fi
        mkdir -p target/qemu
        for lua in lua54 lua53 lua52 lua51; do
          cargo +esp build -Zbuild-std=std,panic_abort --manifest-path testcrate/Cargo.toml --release --bin qemu-testcrate --features "${lua},qemu" --target xtensa-esp32-espidf
          espflash save-image --chip esp32 --merge target/xtensa-esp32-espidf/release/qemu-testcrate "target/qemu/${lua}.bin"
          LOG_FILE="target/qemu/${lua}.log"
          set +e
          timeout --signal=TERM 90 "$QEMU_BIN" -nographic -machine esp32 -drive file="target/qemu/${lua}.bin",if=mtd,format=raw -m 4M | tee "$LOG_FILE"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 143 ]; then
            exit "$status"
          fi
          grep -q "LUA_SRC_QEMU_OK lua=${lua}" "$LOG_FILE"
        done
      shell: bash
    - name: Upload QEMU logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: xtensa-esp32-espidf-qemu-logs
        path: target/qemu/*.log

  rustfmt:
    name: Rustfmt
    if: ${{ false }} # Temporarily disabled while stabilizing the ESP32 QEMU lane.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt -- --check
